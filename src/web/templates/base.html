<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO₂ Estimator — Floras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="h-full bg-gray-50">
    <div class="min-h-full flex flex-col">
        <header class="bg-emerald-700 text-white">
            <div class="max-w-6xl mx-auto px-4 py-4 flex items-center gap-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064" />
                </svg>
                <div>
                    <h1 class="text-xl font-bold">CO₂ Estimator</h1>
                    <p class="text-emerald-200 text-sm">by Floras — climate intelligence for your supply chain</p>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full">
            {% block content %}{% endblock %}
        </main>

        <footer class="bg-gray-100 border-t py-4 text-center text-sm text-gray-500">
            Powered by Floras &mdash; turning transactions into climate action
        </footer>
    </div>
</body>
</html>
